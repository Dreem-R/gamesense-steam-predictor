name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: pip install -r requirements.txt -e ".[dev,train]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t gamesense .

      - name: Check the API container
        run: |
          docker run -d --name api -p 8000:8000 gamesense
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors localhost:8000/health
          curl -sf localhost:8000/model
          curl -sf -X POST localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"genres": ["Indie", "Adventure"], "price": 9.99, "n_screenshots": 8}'

      - name: Check the web app container
        run: |
          docker run -d --name web -p 8501:8501 gamesense \
            streamlit run app/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
          curl -sf --retry 30 --retry-delay 2 --retry-all-errors localhost:8501/_stcore/health

      - name: Container logs
        if: failure()
        run: |
          docker logs api || true
          docker logs web || true
